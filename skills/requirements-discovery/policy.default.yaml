# Default Policy — requirements-discovery
# This file is the base policy. Profile overlays deep-merge on top of this.
# All fields are optional in the overlay; unset fields inherit these values.

# Domain hints bias the Context Analyzer (SaaS, ERP, Mobile, Infra, Internal).
domain_hints: []

# Extra questions beyond the universal question bank.
# See references/question-bank.md for the extension format.
question_bank_extensions: []

# Override the default classification for specific topics.
# Keys are topic slugs (lowercase, hyphenated). Values: BLOCKING | IMPORTANT | OPTIONAL
classification_overrides: {}

# Default option IDs to apply for IMPORTANT/OPTIONAL when no human response.
# Keys are question bank IDs (e.g., I-060). Values are option IDs (e.g., A).
default_policies: {}

# Gate strictness:
#   strict  — BLOCKING also blocks on IMPORTANT (IMPORTANT → hard gate)
#   normal  — BLOCKING blocks; IMPORTANT soft gate with default
#   lax     — BLOCKING blocks; IMPORTANT + OPTIONAL auto-default silently
gate_strictness: normal

# Scope of ADRs generated by this profile.
#   feature  — scoped to the current feature; stored in docs/decisions/
#   system   — scoped to the system/product; stored in docs/decisions/
#   org      — organization-wide; stored in docs/decisions/org/
decision_scope: feature

# Which profiles / roles can approve BLOCKING decisions.
# Empty means "any human in the session".
approver_roles: []

# Whether to emit telemetry JSONL events to swarm-memory log.
telemetry_enabled: true

# Hindsight bank to query and write candidates to.
hindsight_bank: hermes

# Confidence threshold (0.0-1.0) for auto-resolving via Knowledge Reuse Layer.
# Below this score, the decision is presented as "precedent" rather than resolved.
reuse_confidence_threshold: 0.85
