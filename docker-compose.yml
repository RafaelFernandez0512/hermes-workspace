services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      HERMES_UID: ${HERMES_UID:-10010}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_INSECURE: ${HERMES_DASHBOARD_INSECURE:-1}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY:-${HERMES_API_TOKEN:-}}
      TAILSCALE_IP: ""
    volumes:
      - hermes-home:/opt/data
      - /home/winterfell/src/InvoiceUploader:/home/winterfell/src/InvoiceUploader
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8642:8642"
      - "${TAILSCALE_IP:-127.0.0.1}:9119:9119"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:9119/api/status >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - hermes

  hermes-workspace:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      HERMES_API_TOKEN: ${HERMES_API_TOKEN:-${API_SERVER_KEY:-}}
      API_SERVER_KEY: ${API_SERVER_KEY:-${HERMES_API_TOKEN:-}}
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      HERMES_WAIT_FOR_DEPENDENCIES: "0"
      HERMES_TERMINAL_HOST_MODE: "1"
      HERMES_TERMINAL_HOST_HOME: /home/winterfell
      HERMES_TERMINAL_HOST_USER: winterfell
      HERMES_TERMINAL_HOST_CWD: /home/winterfell/hermes-workspace
      HERMES_TERMINAL_HOST_PATH: /home/winterfell/.local/bin:/home/winterfell/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
      HERMES_TERMINAL_HOST_IMAGE: debian:bookworm-slim
      TAILSCALE_IP: ""
    volumes:
      - hermes-home:/home/workspace/.hermes
      - /home/winterfell/src/InvoiceUploader:/home/winterfell/src/InvoiceUploader
      - hermes-workspace-files:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/auth-check >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - hermes

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      hermes-workspace:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:80:80"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443"
    networks:
      - hermes

volumes:
  hermes-home:
  hermes-workspace-files:
  caddy_data:
  caddy_config:

networks:
  hermes:
    driver: bridge
