services:
  hermes-workspace:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app:ro
      - hermes-workspace-node_modules:/app/node_modules
      - hermes-workspace-dist:/app/dist
      - hermes-home:/home/workspace/.hermes
      - hermes-workspace-files:/workspace
    environment:
      HERMES_TERMINAL_HOST_MODE: "1"
      HERMES_TERMINAL_HOST_HOME: /home/winterfell
      HERMES_TERMINAL_HOST_USER: winterfell
      HERMES_TERMINAL_HOST_CWD: /home/winterfell/hermes-workspace
      HERMES_TERMINAL_HOST_PATH: /home/winterfell/.local/bin:/home/winterfell/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
      HERMES_TERMINAL_HOST_IMAGE: debian:bookworm-slim
    command:
      [
        "sh",
        "-lc",
        "pnpm build && (pnpm exec vite build --watch >/tmp/hermes-workspace-build.log 2>&1 &) && exec node server-entry.js",
      ]

volumes:
  hermes-workspace-node_modules:
  hermes-workspace-dist:
